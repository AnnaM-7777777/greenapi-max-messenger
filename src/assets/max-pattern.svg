<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="max-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Фон -->
      <rect width="200" height="200" fill="#e8f4f8"/>
      
      <!-- Иконки (упрощенные символы в стиле MAX) -->
      <!-- Планета -->
      <circle cx="30" cy="30" r="8" fill="none" stroke="#a8d8ea" stroke-width="2"/>
      <ellipse cx="30" cy="30" rx="12" ry="4" fill="none" stroke="#a8d8ea" stroke-width="1.5" transform="rotate(-20 30 30)"/>
      
      <!-- Звезда -->
      <path d="M 80 20 L 82 26 L 88 26 L 83 30 L 85 36 L 80 32 L 75 36 L 77 30 L 72 26 L 78 26 Z" fill="#a8d8ea" opacity="0.6"/>
      
      <!-- Ракета -->
      <path d="M 130 30 L 135 40 L 130 45 L 125 40 Z" fill="none" stroke="#a8d8ea" stroke-width="1.5"/>
      <circle cx="130" cy="35" r="2" fill="#a8d8ea"/>
      
      <!-- Камера -->
      <rect x="170" y="25" width="16" height="12" rx="2" fill="none" stroke="#a8d8ea" stroke-width="1.5"/>
      <circle cx="178" cy="31" r="3" fill="none" stroke="#a8d8ea" stroke-width="1.5"/>
      
      <!-- Сообщение -->
      <path d="M 20 80 L 40 80 L 40 95 L 30 95 L 25 100 L 25 95 L 20 95 Z" fill="none" stroke="#a8d8ea" stroke-width="1.5" rx="2"/>
      
      <!-- Сердце -->
      <path d="M 90 85 C 90 80, 95 80, 95 85 C 95 80, 100 80, 100 85 C 100 92, 95 97, 95 97 C 95 97, 90 92, 90 85 Z" fill="#a8d8ea" opacity="0.5"/>
      
      <!-- Музыкальная нота -->
      <circle cx="140" cy="90" r="3" fill="#a8d8ea" opacity="0.6"/>
      <line x1="143" y1="90" x2="143" y2="80" stroke="#a8d8ea" stroke-width="1.5"/>
      <path d="M 143 80 Q 148 78, 148 82" fill="none" stroke="#a8d8ea" stroke-width="1.5"/>
      
      <!-- Облако -->
      <path d="M 25 140 Q 25 135, 30 135 Q 32 130, 38 130 Q 44 130, 46 135 Q 50 135, 50 140 Q 50 145, 45 145 L 30 145 Q 25 145, 25 140 Z" fill="none" stroke="#a8d8ea" stroke-width="1.5"/>
      
      <!-- Смайлик -->
      <circle cx="95" cy="140" r="8" fill="none" stroke="#a8d8ea" stroke-width="1.5"/>
      <circle cx="92" cy="138" r="1" fill="#a8d8ea"/>
      <circle cx="98" cy="138" r="1" fill="#a8d8ea"/>
      <path d="M 92 142 Q 95 144, 98 142" fill="none" stroke="#a8d8ea" stroke-width="1.5"/>
      
      <!-- Телефон -->
      <rect x="140" y="135" width="12" height="18" rx="2" fill="none" stroke="#a8d8ea" stroke-width="1.5"/>
      <line x1="143" y1="148" x2="149" y2="148" stroke="#a8d8ea" stroke-width="1.5"/>
      
      <!-- Точки и круги для декора -->
      <circle cx="60" cy="170" r="3" fill="#a8d8ea" opacity="0.4"/>
      <circle cx="120" cy="175" r="2" fill="#a8d8ea" opacity="0.5"/>
      <circle cx="180" cy="165" r="4" fill="none" stroke="#a8d8ea" stroke-width="1" opacity="0.6"/>
      
      <!-- Волнистая линия -->
      <path d="M 10 180 Q 20 175, 30 180 Q 40 185, 50 180" fill="none" stroke="#a8d8ea" stroke-width="1.5" opacity="0.5"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#max-pattern)"/>
</svg>